name: Deploy to Hostinger (FTP)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: hostinger
      url: https://i-land1o1.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Hostinger (root domain, base: /)
        run: pnpm run build:hostinger
        env:
          VITE_BASE: "/"

      - name: Verify build output
        run: |
          echo "=== Build output ==="
          ls -la dist/
          echo "--- index.html first lines ---"
          head -5 dist/index.html
          echo "--- index.html last lines ---"
          tail -5 dist/index.html
          echo "=== Verification complete ==="

      - name: Deploy to Hostinger via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: dist/
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
          delete-existing: true
          dangerous-clean-slate: true
          timeout: 180