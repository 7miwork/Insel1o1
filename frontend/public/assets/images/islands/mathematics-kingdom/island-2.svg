<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5faebb"/>
      <stop offset="100%" stop-color="#4398aa"/>
    </linearGradient>
    <linearGradient id="forest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6fbf73"/>
      <stop offset="100%" stop-color="#5ca862"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8aa39b"/>
      <stop offset="100%" stop-color="#728a82"/>
    </linearGradient>
  </defs>
  <!-- Layer 1: Water -->
  <rect width="400" height="320" fill="url(#bg2)"/>
  <path d="M10,255 Q50,245 90,255 Q130,265 170,255 Q210,245 250,255 Q290,265 330,255 Q370,248 400,255" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <path d="M30,270 Q80,260 130,270 Q180,280 230,270 Q280,260 330,270 Q370,278 400,270" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <!-- Layer 2: Forest island (organic blob, wider) -->
  <path d="M95,235 C80,200 85,160 115,140 C145,120 185,115 220,122 C255,129 280,148 288,175 C296,202 285,230 265,240 C245,250 210,255 175,252 C140,249 110,243 95,235Z" fill="url(#forest)" stroke="rgba(60,40,20,0.35)" stroke-width="2.5"/>
  <!-- Light highlight top-left -->
  <path d="M120,148 C145,127 175,121 210,126 C195,122 165,124 138,143 C132,148 128,156 126,165 C124,156 126,149 120,148Z" fill="rgba(255,255,255,0.2)"/>
  <!-- Mountain range -->
  <path d="M120,200 L155,130 L190,200 Z" fill="url(#mountain)" opacity="0.5"/>
  <path d="M160,200 L210,115 L260,200 Z" fill="url(#mountain)" opacity="0.45"/>
  <!-- Dense tree clusters -->
  <g transform="translate(105, 145)">
    <rect x="-3" y="0" width="6" height="18" fill="#7a6652"/>
    <circle cx="0" cy="-6" r="13" fill="#5fad57" opacity="0.6"/>
  </g>
  <g transform="translate(175, 130)">
    <rect x="-3" y="0" width="6" height="16" fill="#7a6652"/>
    <circle cx="0" cy="-5" r="14" fill="#6fbf73" opacity="0.55"/>
    <circle cx="-8" cy="-2" r="10" fill="#5fad57" opacity="0.5"/>
  </g>
  <g transform="translate(235, 140)">
    <rect x="-3" y="0" width="6" height="15" fill="#7a6652"/>
    <circle cx="0" cy="-5" r="12" fill="#6fbf73" opacity="0.5"/>
  </g>
  <g transform="translate(265, 155)">
    <rect x="-2" y="0" width="5" height="14" fill="#7a6652"/>
    <circle cx="0" cy="-5" r="10" fill="#5fad57" opacity="0.45"/>
  </g>
  <!-- Small rocks -->
  <ellipse cx="130" cy="218" rx="9" ry="4" fill="#9aab94"/>
  <ellipse cx="258" cy="220" rx="7" ry="3.5" fill="#9aab94" opacity="0.8"/>
  <!-- Base wave -->
  <path d="M70,238 Q110,228 150,238 Q190,248 230,238 Q270,228 310,238" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
</svg>