<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#549db0"/>
      <stop offset="100%" stop-color="#398a9c"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b4f3a"/>
      <stop offset="100%" stop-color="#554034"/>
    </linearGradient>
  </defs>
  <!-- Layer 1: Water background -->
  <rect width="400" height="320" fill="url(#bg3)"/>
  <!-- Subtle waves -->
  <path d="M20,258 Q65,248 110,258 Q155,268 200,258 Q245,248 290,258 Q335,268 380,258" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <path d="M40,273 Q90,263 140,273 Q190,283 240,273 Q290,263 340,273 Q370,278 400,273" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <!-- Layer 2: Volcano island (more angular silhouette, peak shape) -->
  <path d="M105,235 C85,200 90,165 115,145 C140,125 175,118 205,120 C235,122 265,130 280,155 C295,180 290,215 275,235 C260,250 230,255 195,257 C160,259 125,255 105,235Z" fill="url(#dark)" stroke="rgba(60,40,20,0.35)" stroke-width="2.5"/>
  <!-- Volcano peak -->
  <path d="M175,130 L200,78 L225,130Z" fill="#5a3f2e"/>
  <!-- Crater -->
  <ellipse cx="200" cy="80" rx="8" ry="3" fill="#8c4830"/>
  <!-- Layer 3: Light highlight top-left -->
  <path d="M125,155 C145,135 170,128 200,125 C185,122 158,126 140,145 C134,150 130,158 128,168 C126,158 128,152 125,155Z" fill="rgba(255,255,255,0.15)"/>
  <!-- Smoke wisps from crater -->
  <g opacity="0.25" fill="#aaa8a0">
    <circle cx="200" cy="70" r="5"/>
    <circle cx="196" cy="60" r="4"/>
    <circle cx="203" cy="52" r="3"/>
    <circle cx="198" cy="44" r="2.5"/>
  </g>
  <!-- Lava streak -->
  <path d="M200,82 Q208,100 205,118" stroke="#b85a30" stroke-width="2.5" fill="none" opacity="0.5"/>
  <path d="M200,82 Q192,98 195,115" stroke="#b85a30" stroke-width="1.5" fill="none" opacity="0.3"/>
  <!-- Layer 4: Minimal details - sparse vegetation -->
  <!-- Few hardy trees -->
  <rect x="145" y="150" width="3" height="14" fill="#7a6652"/>
  <circle cx="146" cy="144" r="8" fill="#6fbf73" opacity="0.3"/>
  <rect x="248" y="160" width="3" height="12" fill="#7a6652"/>
  <circle cx="249" cy="155" r="7" fill="#6fbf73" opacity="0.25"/>
  <!-- Rocks -->
  <ellipse cx="130" cy="215" rx="8" ry="4" fill="#8a7a6a"/>
  <ellipse cx="260" cy="218" rx="6" ry="3" fill="#8a7a6a" opacity="0.7"/>
  <!-- Base wave -->
  <path d="M80,238 Q120,228 160,238 Q200,248 240,238 Q280,228 320,238" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
</svg>