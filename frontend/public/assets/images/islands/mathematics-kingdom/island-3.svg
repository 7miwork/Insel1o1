<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <defs>
    <linearGradient id="sand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="grass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <rect width="400" height="320" fill="url(#water)"/>
  <path d="M70,180 Q55,130 100,95 Q145,65 195,78 Q245,60 285,90 Q320,80 340,120 Q358,150 348,195 Q338,235 305,258 Q265,278 215,272 Q165,282 125,258 Q92,235 75,195 Z" fill="url(#sand)"/>
  <path d="M100,155 Q125,115 165,125 Q205,108 240,138 Q268,168 258,198 Q238,222 198,218 Q158,228 128,202 Q105,182 100,155 Z" fill="url(#grass)"/>
  <!-- Large mountain (calculus theme) -->
  <path d="M180,200 L250,80 L320,200 Z" fill="#78716c" opacity="0.7"/>
  <path d="M220,200 L280,120 L340,200 Z" fill="#57534e" opacity="0.6"/>
  <!-- Snow cap -->
  <path d="M250,80 L260,110 L240,110 Z" fill="#f8fafc" opacity="0.8"/>
  <!-- Observatory/tower -->
  <g transform="translate(240, 155)">
    <rect x="0" y="5" width="24" height="30" fill="#fef3c7"/>
    <path d="M-5,5 L12,-10 L35,5 Z" fill="#b45309"/>
    <rect x="8" y="15" width="8" height="20" fill="#78350f"/>
    <circle cx="12" cy="18" r="4" fill="#0ea5e9" opacity="0.7"/>
  </g>
  <!-- Trees -->
  <g transform="translate(110, 125)">
    <rect x="-3" y="0" width="6" height="22" fill="#92400e"/>
    <circle cx="0" cy="-5" r="11" fill="#15803d"/>
  </g>
  <g transform="translate(300, 135)">
    <rect x="-4" y="0" width="8" height="26" fill="#78350f"/>
    <circle cx="0" cy="-6" r="13" fill="#166534"/>
  </g>
  <!-- Calculus symbols -->
  <text x="320" y="90" font-size="20" fill="#fbbf24" opacity="0.6" font-family="serif">∫</text>
  <text x="60" y="140" font-size="16" fill="#fbbf24" opacity="0.5" font-family="serif">∂</text>
  <text x="330" y="170" font-size="14" fill="#fbbf24" opacity="0.4" font-family="serif">Δ</text>
</svg>