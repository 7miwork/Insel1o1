<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <defs>
    <linearGradient id="sand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="grass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <!-- Water background -->
  <rect width="400" height="320" fill="url(#water)"/>
  <!-- Island base (organic beach shape) -->
  <path d="M80,180 Q60,140 100,110 Q140,80 180,90 Q220,70 260,100 Q300,90 320,130 Q340,160 330,200 Q320,240 290,260 Q250,280 200,275 Q150,285 110,260 Q80,240 80,200 Z" fill="url(#sand)"/>
  <!-- Grass patches -->
  <path d="M120,160 Q140,120 180,130 Q220,110 250,140 Q270,170 260,200 Q240,220 200,215 Q160,225 130,200 Q110,180 120,160 Z" fill="url(#grass)"/>
  <!-- Trees -->
  <g transform="translate(140, 130)">
    <rect x="-3" y="0" width="6" height="25" fill="#92400e"/>
    <circle cx="0" cy="-5" r="12" fill="#15803d"/>
  </g>
  <g transform="translate(210, 120)">
    <rect x="-4" y="0" width="8" height="30" fill="#78350f"/>
    <circle cx="0" cy="-8" r="15" fill="#166534"/>
  </g>
  <g transform="translate(250, 145)">
    <rect x="-3" y="0" width="6" height="22" fill="#92400e"/>
    <circle cx="0" cy="-5" r="11" fill="#15803d"/>
  </g>
  <!-- Mountains -->
  <path d="M90,200 L130,120 L170,200 Z" fill="#78716c" opacity="0.6"/>
  <path d="M130,200 L180,110 L230,200 Z" fill="#57534e" opacity="0.5"/>
  <!-- Small building (school/hut) -->
  <g transform="translate(175, 165)">
    <rect x="0" y="10" width="30" height="20" fill="#fef3c7"/>
    <path d="M-5,10 L15,-5 L45,10 Z" fill="#b45309"/>
    <rect x="10" y="18" width="10" height="12" fill="#78350f"/>
  </g>
  <!-- Algebra symbols floating -->
  <text x="300" y="100" font-size="20" fill="#fbbf24" opacity="0.6" font-family="serif">∑</text>
  <text x="70" y="150" font-size="16" fill="#fbbf24" opacity="0.5" font-family="serif">∫</text>
  <text x="310" y="180" font-size="14" fill="#fbbf24" opacity="0.4" font-family="serif">π</text>
</svg>