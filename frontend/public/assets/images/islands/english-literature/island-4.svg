<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <defs>
    <linearGradient id="sand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="grass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <rect width="400" height="320" fill="url(#water)"/>
  <path d="M70,185 Q55,135 100,100 Q145,70 195,82 Q245,65 285,95 Q320,85 340,125 Q358,155 348,200 Q338,240 305,262 Q265,282 215,276 Q165,286 125,262 Q92,238 75,198 Z" fill="url(#sand)"/>
  <path d="M95,165 Q120,125 160,135 Q200,118 235,148 Q262,178 252,208 Q232,232 192,228 Q152,238 122,212 Q100,192 95,165 Z" fill="url(#grass)"/>
  <!-- Poetry quill / book theme -->
  <g transform="translate(170, 140)">
    <rect x="0" y="5" width="50" height="35" rx="3" fill="#fef3c7" opacity="0.9"/>
    <path d="M5,5 L25,-8 L55,5 Z" fill="#b45309"/>
    <line x1="15" y1="12" x2="40" y2="12" stroke="#92400e" stroke-width="2"/>
    <line x1="15" y1="20" x2="35" y2="20" stroke="#92400e" stroke-width="2"/>
    <line x1="15" y1="28" x2="30" y2="28" stroke="#92400e" stroke-width="2"/>
  </g>
  <!-- Quill -->
  <g transform="translate(250, 130) rotate(30)">
    <path d="M0,0 Q5,-20 2,-40 Q0,-50 -5,-40 Q-3,-20 0,0 Z" fill="#fef3c7"/>
    <path d="M-5,0 L5,0 L8,15 L-8,15 Z" fill="#78350f"/>
  </g>
  <!-- Trees -->
  <g transform="translate(115, 115)">
    <rect x="-3" y="0" width="6" height="24" fill="#92400e"/>
    <circle cx="0" cy="-5" r="12" fill="#15803d"/>
  </g>
  <g transform="translate(305, 140)">
    <rect x="-4" y="0" width="8" height="26" fill="#78350f"/>
    <circle cx="0" cy="-6" r="13" fill="#166534"/>
  </g>
  <!-- Poetry symbols -->
  <text x="60" y="120" font-size="20" fill="#fbbf24" opacity="0.6" font-family="serif">❝</text>
  <text x="320" y="110" font-size="16" fill="#fbbf24" opacity="0.5" font-family="serif">❞</text>
  <text x="80" y="200" font-size="14" fill="#fbbf34" opacity="0.5" font-family="serif">~</text>
</svg>