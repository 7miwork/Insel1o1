    <circle cx="0" cy="-4" r="9" fill="#8fbf7a" opacity="0.45"/>
  </g>
  <!-- Rocks -->
  <ellipse cx="150" cy="210" rx="9" ry="4" fill="#b8a88e"/>
  <ellipse cx="265" cy="215" rx="7" ry="3" fill="#b8a88e" opacity="0.8"/>
