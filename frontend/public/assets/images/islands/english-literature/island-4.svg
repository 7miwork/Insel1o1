<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6bb7c9"/>
      <stop offset="100%" stop-color="#4aa3b5"/>
    </linearGradient>
    <linearGradient id="sand4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8d3a2"/>
      <stop offset="100%" stop-color="#d4bd8c"/>
    </linearGradient>
  </defs>
  <!-- Layer 1: Water -->
  <rect width="400" height="320" fill="url(#bg4)"/>
  <path d="M20,255 Q60,245 100,255 Q140,265 180,255 Q220,245 260,255 Q300,265 340,255 Q370,248 390,255" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <path d="M40,270 Q90,260 140,270 Q190,280 240,270 Q290,260 340,270 Q380,278 400,270" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <!-- Layer 2: Island shape (organic blob) -->
  <path d="M100,232 C82,198 92,158 122,142 C152,126 190,120 222,128 C254,136 278,154 284,180 C290,206 280,232 262,238 C244,246 214,250 182,248 C150,246 118,240 100,232Z" fill="url(#sand4)" stroke="rgba(60,40,20,0.35)" stroke-width="2.5"/>
  <!-- Light highlight -->
  <path d="M128,148 C150,130 182,124 212,130 C196,126 168,128 146,145 C140,150 136,158 134,166 C132,158 134,152 128,148Z" fill="rgba(255,255,255,0.25)"/>
  <!-- Layer 4: Details - open book + quill (Poetry Island) -->
  <!-- Book -->
  <g transform="translate(185, 155)">
    <rect x="0" y="8" width="46" height="32" rx="2" fill="#fef3c7"/>
    <path d="M-4,8 L23,-6 L50,8 Z" fill="#b45309"/>
    <line x1="12" y1="18" x2="36" y2="18" stroke="#92400e" stroke-width="2"/>
    <line x1="12" y1="26" x2="32" y2="26" stroke="#92400e" stroke-width="2"/>
    <line x1="12" y1="34" x2="28" y2="34" stroke="#92400e" stroke-width="2"/>
  </g>
  <!-- Quill -->
  <g transform="translate(245, 145) rotate(35)">
    <rect x="-1" y="0" width="2" height="24" fill="#d4a574"/>
    <path d="M-4,0 Q0,-12 0,-18 Q0,-24 0,-18 Q0,-12 4,0 Z" fill="#fef3c7"/>
    <path d="M-4,0 L4,0 L5,6 L-5,6 Z" fill="#78350f"/>
  </g>
  <!-- 1 tree -->
  <g transform="translate(135, 142)">
    <rect x="-2" y="0" width="4" height="16" fill="#7a6652"/>
    <circle cx="0" cy="-5" r="10" fill="#8fbf7a" opacity="0.55"/>
  </g>
  <g transform="translate(280, 158)">
