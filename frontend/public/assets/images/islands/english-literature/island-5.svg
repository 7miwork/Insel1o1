<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <defs>
    <linearGradient id="sand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="grass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <rect width="400" height="320" fill="url(#water)"/>
  <path d="M65,195 Q50,145 95,108 Q140,75 190,88 Q240,70 280,100 Q315,92 338,128 Q358,162 348,205 Q338,245 302,268 Q262,288 212,282 Q162,292 122,268 Q88,245 70,205 Z" fill="url(#sand)"/>
  <path d="M88,172 Q112,132 152,142 Q192,125 228,155 Q258,185 248,215 Q228,240 188,236 Q148,246 118,220 Q98,200 88,172 Z" fill="url(#grass)"/>
  <!-- Library / Novel theme: bookshelf building -->
  <g transform="translate(155, 148)">
    <rect x="0" y="10" width="60" height="45" rx="3" fill="#92400e" opacity="0.9"/>
    <rect x="5" y="14" width="50" height="8" fill="#78350f"/>
    <rect x="5" y="25" width="50" height="8" fill="#78350f"/>
    <rect x="5" y="36" width="50" height="8" fill="#78350f"/>
    <!-- Books spines -->
    <rect x="10" y="15" width="6" height="6" fill="#ef4444" opacity="0.8"/>
    <rect x="20" y="15" width="5" height="6" fill="#3b82f6" opacity="0.8"/>
    <rect x="28" y="15" width="7" height="6" fill="#22c55e" opacity="0.8"/>
    <rect x="38" y="15" width="5" height="6" fill="#fbbf24" opacity="0.8"/>
    <path d="M-5,10 L30,-10 L75,10 Z" fill="#b45309"/>
  </g>
  <!-- Quill and ink -->
  <g transform="translate(100, 130) rotate(-15)">
    <path d="M0,0 Q5,-18 2,-35 Q0,-42 -5,-35 Q-3,-18 0,0 Z" fill="#fef3c7"/>
    <path d="M-5,0 L5,0 L8,12 L-8,12 Z" fill="#1e293b"/>
  </g>
  <circle cx="120" cy="135" r="4" fill="#1e293b" opacity="0.7"/>
  <!-- Trees -->
  <g transform="translate(125, 115)">
    <rect x="-3" y="0" width="6" height="23" fill="#92400e"/>
    <circle cx="0" cy="-5" r="11" fill="#15803d"/>
  </g>
  <g transform="translate(300, 135)">
    <rect x="-4" y="0" width="8" height="25" fill="#78350f"/>
    <circle cx="0" cy="-6" r="12" fill="#166534"/>
  </g>
  <!-- Novel symbols -->
  <text x="60" y="115" font-size="20" fill="#fbbf24" opacity="0.6" font-family="serif">📖</text>
  <text x="330" y="105" font-size="16" fill="#fbbf24" opacity="0.5" font-family="serif">✎</text>
</svg>