<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5faebb"/>
      <stop offset="100%" stop-color="#4398aa"/>
    </linearGradient>
    <linearGradient id="sand5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8d3a2"/>
      <stop offset="100%" stop-color="#d4bd8c"/>
    </linearGradient>
  </defs>
  <!-- Layer 1: Water -->
  <rect width="400" height="320" fill="url(#bg5)"/>
  <path d="M10,255 Q50,245 90,255 Q130,265 170,255 Q210,245 250,255 Q290,265 330,255 Q370,248 400,255" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <path d="M30,270 Q80,260 130,270 Q180,280 230,270 Q280,260 330,270 Q370,278 400,270" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <!-- Layer 2: Island shape (organic blob) -->
  <path d="M98,235 C80,200 88,160 118,142 C148,124 186,118 218,126 C250,134 275,152 281,178 C287,204 278,232 260,238 C242,246 212,250 180,248 C148,246 116,240 98,235Z" fill="url(#sand5)" stroke="rgba(60,40,20,0.35)" stroke-width="2.5"/>
  <!-- Light highlight -->
  <path d="M122,148 C145,128 176,122 208,128 C192,124 163,126 140,144 C134,149 130,157 128,166 C126,157 128,151 122,148Z" fill="rgba(255,255,255,0.25)"/>
  <!-- Layer 4: Details - Novel Island: stack of books + reading lantern -->
  <!-- Book stack -->
  <g transform="translate(180, 160)">
    <rect x="0" y="20" width="40" height="8" rx="1" fill="#b45309"/>
    <rect x="2" y="12" width="36" height="8" rx="1" fill="#92400e"/>
    <rect x="4" y="4" width="32" height="8" rx="1" fill="#b45309"/>
    <rect x="6" y="-4" width="28" height="8" rx="1" fill="#92400e"/>
  </g>
  <!-- Lantern -->
  <g transform="translate(250, 140)">
    <rect x="-2" y="0" width="4" height="18" fill="#78350f"/>
    <rect x="-6" y="-2" width="12" height="10" rx="2" fill="#fef3c7" opacity="0.85"/>
    <circle cx="0" cy="3" r="2.5" fill="#fbbf24" opacity="0.8"/>
  </g>
  <!-- 2 trees -->
  <g transform="translate(130, 140)">
    <rect x="-2" y="0" width="4" height="15" fill="#7a6652"/>
    <circle cx="0" cy="-5" r="10" fill="#8fbf7a" opacity="0.55"/>
  </g>
  <g transform="translate(300, 155)">
    <rect x="-2" y="0" width="4" height="14" fill="#7a6652"/>
    <circle cx="0" cy="-4" r="9" fill="#8fbf7a" opacity="0.45"/>
  </g>
  <!-- Rocks -->
  <ellipse cx="145" cy="210" rx="9" ry="4" fill="#b8a88e"/>
  <ellipse cx="275" cy="215" rx="7" ry="3.5" fill="#b8a88e" opacity="0.8"/>
  <!-- Base wave -->
  <path d="M75,235 Q115,226 155,235 Q195,244 235,235 Q275,226 315,235" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
</svg>